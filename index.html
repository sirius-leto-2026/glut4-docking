const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yn = v => v ? '<span class="ok">да</span>' : '<span class="no">нет</span>';

function table(rows, cols, opts) {
  opts = opts || {};
  if (!rows.length) return '<p class="muted">Нет данных: запустите расчёт.</p>';
  const id = "t" + Math.random().toString(36).slice(2, 8);
  let h = `<table id="${id}"><thead><tr>` +
    cols.map((c,i) => `<th data-i="${i}">${esc(c[1])}</th>`).join("") + "</tr></thead><tbody>";
  h += rows.map(r => "<tr>" + cols.map(c => `<td>${c[2] ? c[2](r) : esc(r[c[0]])}</td>`).join("") + "</tr>").join("");
  h += "</tbody></table>";
  setTimeout(() => sortable(id), 0);
  return h;
}
function sortable(id) {
  const t = document.getElementById(id); if (!t) return;
  t.querySelectorAll("th").forEach((th, i) => th.onclick = () => {
    const tb = t.tBodies[0], rows = [...tb.rows];
    const dir = th.dataset.dir === "asc" ? -1 : 1;
    t.querySelectorAll("th").forEach(x => x.dataset.dir = "");
    th.dataset.dir = dir === 1 ? "asc" : "desc";
    rows.sort((a, b) => {
      const x = a.cells[i].innerText.trim(), y = b.cells[i].innerText.trim();
      const nx = parseFloat(x.replace(",", ".")), ny = parseFloat(y.replace(",", "."));
      if (!isNaN(nx) && !isNaN(ny)) return (nx - ny) * dir;
      return x.localeCompare(y, "ru") * dir;
    });
    rows.forEach(r => tb.appendChild(r));
  });
}

  <div>${table(D.modes || [], [["name_ru","Соединение"],["score_mean_rigid","Жёсткий"],
    ["score_mean_flex","Гибкий"],["d_score","Δ оценки"],["rank_rigid","Ранг Ж"],
    ["rank_flex","Ранг Г"],["d_rank","Δ ранга"]])}</div></div>
  <div class="note">Подвижность боковых цепей смоделирована смягчением отталкивания
  (soft-core) для ${(D.site.pocket_residues || []).length} остатков кармана. Это упрощение
  по сравнению с явным перебором положений цепей в AutoDock Vina.</div>`;
}

function control() {
  const c = D.control || {};
  return `<h2>Контрольный докинг цитохалазина B</h2>
  <p>Повторный докинг лиганда, положение которого известно из структуры 7WSM.
  Так проверяется, что протокол вообще способен находить правильный ответ.</p>
  <div class="cards">
    <div class="card"><div class="v">${c.rmsd_mean ?? "—"} Å</div><div class="t">средний RMSD</div></div>
    <div class="card"><div class="v">${c.rmsd_best ?? "—"} Å</div><div class="t">лучший запуск</div></div>
    <div class="card"><div class="v">${c.score_reference_pose ?? "—"}</div><div class="t">оценка экспериментальной позы</div></div>
    <div class="card"><div class="v">${c.protocol_accepted ? "принят" : "не принят"}</div><div class="t">протокол</div></div>
  </div>
  ${table(c.runs || [], [["run","Запуск"],["score","Оценка"],["rmsd","RMSD, Å"],
    ["rmsd_matched","RMSD с сопоставлением"],["seconds","Время, с"]])}
  <h3>Участок связывания</h3>
  <p>${(D.site.pocket_residues || []).join(", ")}</p>
  <p class="muted">Центр области поиска ${(D.site.box_center || []).join("; ")},
  куб ${D.site.box_size} Å, структура ${D.site.pdb_id}, UniProt ${D.site.uniprot}.</p>`;
}

function contacts() {
  const c = D.contacts || {};
  const keys = Object.keys(c);
  if (!keys.length) return "<h2>Контакты</h2><p class='muted'>Нет данных.</p>";
  return `<h2>Межмолекулярные контакты лучших поз</h2>
  <p class="muted">Водородная связь — полярные атомы ближе 3,5 Å; гидрофобный контакт —
  неполярные атомы ближе 4,0 Å.</p>` +
  keys.map(k => {
    const x = c[k];
    return `<details><summary>${esc(x.name_ru)} — ${x.n_hbonds} H-связей,
      ${x.n_hydrophobic} гидрофобных контактов, ${x.n_residues} остатков</summary>
      <p><b>Остатки:</b> ${(x.residues || []).join(", ")}</p>
      ${table((x.hbonds || []).map(h => ({res: h[0], at: h[1], lig: h[2], d: h[3]})),
        [["res","Остаток"],["at","Атом белка"],["lig","Атом лиганда"],["d","Расстояние, Å"]])}
      </details>`;
  }).join("");
}

function checks() {
  const v = D.validation || {};
  const d = v.descriptors || {};
  return `<h2>Независимые проверки расчётов</h2>
  ${table(v.checks || [], [["проверка","Проверка"],["значение_1","Способ 1"],
    ["значение_2","Способ 2"],["расхождение","Расхождение"],
    ["пройдена","Итог", r => yn(r["пройдена"])]])}
  <h3>Дескрипторы: свой разбор SMILES против PubChem</h3>
  <p>Совпало по числу тяжёлых атомов: ${d.heavy_match ?? "—"} из ${d.n ?? "—"};
  среднее расхождение по массе ${d.mw_mae ?? "—"} а.е.м.;
  доноры H-связей совпали у ${d.hbd_match ?? "—"};
  вращаемые связи в пределах ±1 у ${d.rotb_within_1 ?? "—"}.</p>
  ${table((d.table || []).slice(0, 40), [["name_ru","Соединение"],
    ["heavy_mine","Тяж. свои"],["heavy_pubchem","Тяж. PubChem"],
    ["mw_mine","Масса своя"],["mw_pubchem","Масса PubChem"],
    ["hbd_mine","Доноры свои"],["hbd_pubchem","Доноры PubChem"]])}`;
}

const RENDER = {overview, plan, library, screen: screenTab, modes, control, contacts, checks};
const nav = document.getElementById("nav");
TABS.forEach(([id, label], i) => {
  const b = document.createElement("button");
  b.textContent = label; b.className = i === 0 ? "on" : "";
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll("main section").forEach(s => s.classList.remove("on"));
    const sec = document.getElementById("tab-" + id);
    sec.classList.add("on");
    if (!sec.dataset.ready) { sec.innerHTML = RENDER[id](); sec.dataset.ready = "1"; }
    if (id === "library") hookSearch();
  };
  nav.appendChild(b);
});
function hookSearch() {
  const q = document.getElementById("q"); if (!q || q.dataset.on) return;
  q.dataset.on = "1";
  q.oninput = () => {
    const s = q.value.toLowerCase().trim();
    const rows = (D.library || []).filter(r =>
      !s || (r.name_ru + " " + r.name_en + " " + r.class).toLowerCase().includes(s));
    document.getElementById("libtable").innerHTML = libTable(rows);
  };
}
document.getElementById("tab-overview").innerHTML = overview();
document.getElementById("tab-overview").dataset.ready = "1";
</script></body></html>
